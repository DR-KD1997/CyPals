name: Build

# Builds CyPals for Android, Windows and Linux on GitHub's machines.
# - Every push to main / manual run: builds everything and keeps the files as workflow artifacts.
# - When main reaches a version (package.json "version") that has no release yet,
#   or a tag like v0.1.0 is pushed: also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Queue new runs instead of cancelling one that is already building.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_needed: ${{ steps.version.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"; echo "v$V is already released"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"; echo "v$V has no release yet"
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: scripts/ci-run.sh typecheck npm run typecheck
      - run: scripts/ci-run.sh tests npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: xcap's PipeWire bindings need a newer libpipewire than 22.04 ships.
          - os: ubuntu-24.04
            name: linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: windows
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libxcb1-dev libxrandr-dev libclang-dev
      - run: npm ci
      - name: Rust tests
        if: matrix.name == 'linux'
        # The Tauri crate embeds the built frontend, so dist/ must exist before compiling.
        run: |
          scripts/ci-run.sh frontend-build npm run build
          scripts/ci-run.sh cargo-test cargo test --manifest-path src-tauri/Cargo.toml
      - run: scripts/ci-run.sh tauri-build npx tauri build --bundles ${{ matrix.bundles }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cypals-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    needs: test
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.test.outputs.version }}
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # GitHub's Ubuntu runners ship the Android SDK at $ANDROID_HOME; just add what's missing.
      - name: Install NDK, platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;${BUILD_TOOLS}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Generate Android project
        run: scripts/ci-run.sh android-init npx tauri android init --ci
      - name: Declare microphone and camera permissions
        # Voice notes, Call mode and webcam vision; Android asks the user the first time.
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for perm in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            grep -q "android.permission.$perm" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$perm\" />\n    <application#" "$M"
          done
          grep -q 'android.hardware.camera' "$M" || sed -i 's#<application#<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          grep -n "uses-" "$M"
      - name: Build APK
        run: scripts/ci-run.sh android-build npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "Unsigned APK: $UNSIGNED"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            # No signing secret yet: sign with a throwaway key so the APK still installs.
            # (Updates signed with a different key won't install over it.)
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; signing with a temporary key."
            KEYSTORE_PASSWORD=temporary; KEY_ALIAS=cypals
            keytool -genkeypair -keystore release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=CyPals CI"
          fi
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" out/aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "out/CyPals_${VERSION}_android.apk" out/aligned.apk
          "$BT/apksigner" verify --print-certs out/CyPals_*_android.apk | head -3
          rm -f out/aligned.apk release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: cypals-android
          if-no-files-found: error
          path: out/*.apk

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.release_needed == 'true')
    needs: [test, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CyPals v${{ needs.test.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dist/**/*
