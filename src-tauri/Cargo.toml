[package]
name = "cypals"
version = "0.1.0"
description = "CyPals — AI companions with 3D, Live2D and portrait avatars"
authors = ["Kaan"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cypals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

# Desktop-only: screen capture, OS keychain, image downscaling for vision frames.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
